<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汪汪奶茶店</title>
<style>:root{--card:#fffaf1;--text:#302116;--muted:#735f4a;--line:#e4cda8;--brand:#b65d2a;--bad:#b13a35;--focus:#0969da}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(135deg,#fff1d3,#f9dfc9,#eadcff)}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.app{width:min(1100px,calc(100% - 24px));margin:auto;padding:14px 0 34px}.card,.hero{background:rgba(255,250,241,.96);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 42px rgba(104,62,24,.16);padding:16px}.hero{position:sticky;top:0;z-index:5}h1{font-size:clamp(1.8rem,4vw,2.7rem);margin:.1em 0}p,.small{color:var(--muted);line-height:1.65}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:12px}.btn{border:0;border-radius:14px;padding:10px 13px;background:var(--brand);color:white;cursor:pointer}.btn.secondary{background:#f0dfc3;color:var(--text);border:1px solid var(--line)}.btn.bad{background:var(--bad)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tabbtn{border:1px solid var(--line);background:white;color:var(--text);border-radius:999px;padding:9px 14px;cursor:pointer}.tabbtn[aria-current=page]{background:var(--brand);color:#fff}.page{margin-top:14px}.hidden{display:none!important}.notice{border:1px solid #c9b587;background:#fff8df;border-radius:16px;padding:10px 12px;color:var(--muted);line-height:1.55}.notice.good{border-color:#96c995;background:#ecfae9;color:#245e30}.notice.bad{border-color:#dea0a0;background:#fff0f0;color:#7d2c2c}.notice.info{border-color:#a8c6df;background:#eef7ff;color:#2e5d7d}.pill{border:1px solid var(--line);background:rgba(255,255,255,.62);padding:7px 11px;border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.item{padding:11px;border:1px solid rgba(228,205,168,.95);border-radius:16px;background:rgba(255,255,255,.58)}.stat strong{display:block;font-size:1.25rem}label{display:grid;gap:5px;color:var(--muted)}input{width:100%;border:1px solid var(--line);border-radius:13px;padding:10px;background:white}.log{display:grid;gap:8px;max-height:360px;overflow:auto}.log div{padding:8px 10px;border:1px solid rgba(228,205,168,.8);border-radius:12px;background:rgba(255,255,255,.55);color:var(--muted)}dialog{border:1px solid var(--line);border-radius:24px;width:min(620px,calc(100% - 24px));background:var(--card);color:var(--text);box-shadow:0 24px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(42,25,12,.42)}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:820px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{position:static}}@media(max-width:520px){.stats{grid-template-columns:1fr}.tabbtn{flex:1 1 30%}}</style></head>
<body><div class="app" id="appRoot" aria-hidden="true"><header class="hero stack"><div class="between"><div><h1>🐶 汪汪奶茶店</h1><p>经营一家街角奶茶店：定价、采购、研发、员工和每日事件都会影响生意。</p></div><span class="pill" id="cloudText">☁️ 未登录</span></div><div id="status" class="notice info" role="status" aria-live="polite" aria-atomic="true">请先登录或注册云存档。</div><div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div><nav class="tabs" aria-label="主要功能按钮"><button class="tabbtn" data-page-btn="shop" aria-current="page">店铺</button><button class="tabbtn" data-page-btn="menu">菜单</button><button class="tabbtn" data-page-btn="buy">采购</button><button class="tabbtn" data-page-btn="staff">员工</button><button class="tabbtn" data-page-btn="book">账本</button><button class="tabbtn" data-page-btn="save">存档</button></nav></header><main>
<section class="card page stack" data-page="shop"><div class="between"><h2>今日营业</h2><span class="pill" id="dayInfo"></span></div><div id="stats" class="stats"></div><div id="todayEvent" class="notice"></div><div class="row"><button class="btn" id="openBtn">开始营业一天</button><button class="btn secondary" id="restBtn">整理半天</button></div><h3>顾客记录</h3><div id="customerLog" class="log" aria-live="polite"></div></section>
<section class="card page stack hidden" data-page="menu"><h2>菜单与定价</h2><p class="small">价格太高会减少购买概率；价格太低利润会变少。</p><div id="menuList" class="grid"></div></section><section class="card page stack hidden" data-page="buy"><h2>采购原料</h2><div id="stockList" class="grid"></div></section><section class="card page stack hidden" data-page="staff"><h2>员工与升级</h2><div id="staffList" class="grid"></div><h3>店铺升级</h3><div id="upgradeList" class="grid"></div></section><section class="card page stack hidden" data-page="book"><h2>账本</h2><div id="bookStats" class="stats"></div><h3>经营日志</h3><div id="gameLog" class="log"></div></section><section class="card page stack hidden" data-page="save"><h2>云存档</h2><p class="small">当前用户：<strong id="userText">未登录</strong></p><div class="row"><button class="btn secondary" id="manualSaveBtn">手动保存</button><button class="btn bad" id="newGameBtn">重开当前存档</button></div></section></main></div>
<dialog id="loginDialog" aria-labelledby="loginTitle"><form method="dialog" class="stack" id="loginForm"><h2 id="loginTitle">登录汪汪奶茶店</h2><p class="small">输入用户名和密码。新账号会自动创建云存档，旧账号会读取原来的进度。</p><label>用户名<input id="loginName" autocomplete="username" maxlength="24" required></label><label>密码<input id="loginPass" type="password" autocomplete="current-password" maxlength="64" required></label><div id="loginStatus" class="notice info" role="status" aria-live="polite" aria-atomic="true">准备登录。</div><div class="row"><button class="btn" id="loginSubmit">登录 / 注册</button><button class="btn secondary" id="loginLocal">本机试玩</button></div></form></dialog><dialog id="msgDialog" aria-labelledby="msgTitle"><div class="stack"><h2 id="msgTitle">消息</h2><div id="msgBody" class="small"></div><button class="btn" id="msgOk">知道了</button></div></dialog>
<script>
const API_BASE='/api/v1/public/projects/fa2cf3b8-5a34-4a24-b120-6c2dec679c4c';const PROJECT_KEY='4ada7e8b1c8416b63c8ee95c7fb465564149e10fd2b8d02e';const COLLECTION='milk_tea_saves';
const T={"cash": "现金", "rep": "声望", "energy": "体力", "store": "仓库", "notOpen": "还没开始今天的营业。", "saveOk": "云存档成功。", "saveFail": "云存档失败：", "local": "本机试玩", "cloud": "云存档已连接", "loginFail": "登录失败：", "logining": "正在连接云存档……", "needLogin": "请填写用户名和密码。", "welcome": "欢迎回来，已恢复你的奶茶店。", "newUser": "新账号创建成功。你的汪汪奶茶店开张啦！", "storyTitle": "开店剧情", "story": "你在巷口租下了一间小店。门口的狗狗招牌还没挂稳，第一位顾客已经探头问：“老板，今天有珍珠奶茶吗？”", "success": "成功：", "error": "错误：", "tip": "提示："};const recipes={"classic": {"name": "招牌珍珠奶茶", "emoji": "🧋", "basePrice": 16, "cost": {"tea": 1, "milk": 1, "boba": 1, "sugar": 1}, "charm": 1}, "taro": {"name": "芋泥波波奶茶", "emoji": "🍠", "basePrice": 22, "cost": {"tea": 1, "milk": 2, "boba": 1, "sugar": 1}, "charm": 1.18}, "fruit": {"name": "满杯鲜果茶", "emoji": "🍊", "basePrice": 20, "cost": {"tea": 1, "fruit": 2, "sugar": 1}, "charm": 1.1}, "cheese": {"name": "芝士奶盖茶", "emoji": "🧀", "basePrice": 24, "cost": {"tea": 1, "milk": 2, "cream": 1, "sugar": 1}, "charm": 1.22}, "coffee": {"name": "咖啡冻奶茶", "emoji": "☕", "basePrice": 23, "cost": {"tea": 1, "milk": 1, "coffee": 1, "boba": 1}, "charm": 1.16}, "seasonal": {"name": "季节限定特调", "emoji": "✨", "basePrice": 28, "cost": {"tea": 1, "milk": 1, "fruit": 1, "cream": 1, "sugar": 1}, "charm": 1.35}};const materials={"tea": {"name": "茶叶", "unitCost": 3}, "milk": {"name": "鲜奶", "unitCost": 4}, "boba": {"name": "珍珠", "unitCost": 2}, "sugar": {"name": "糖浆", "unitCost": 1}, "fruit": {"name": "水果", "unitCost": 5}, "cream": {"name": "奶盖", "unitCost": 5}, "coffee": {"name": "咖啡冻", "unitCost": 4}};const staffDefs={"cashier": {"name": "收银小妹", "desc": "每天顾客 +2，差评概率降低。", "cost": 180}, "barista": {"name": "调饮师傅", "desc": "顾客事件负面概率降低。", "cost": 260}, "promoter": {"name": "发传单小哥", "desc": "每天顾客 +4。", "cost": 220}};const upgradeDefs={"sign": {"name": "可爱狗狗招牌", "desc": "客流和声望增长。", "cost": 160}, "fridge": {"name": "大冰柜", "desc": "原料容量提升。", "cost": 220}, "machine": {"name": "自动封口机", "desc": "每天多接待顾客。", "cost": 260}, "sofa": {"name": "舒适座位区", "desc": "好评和回头客提升。", "cost": 320}};
let state=newGame(),saveKey='',recordId='',cloud=false,currentUser='';const $=id=>document.getElementById(id);
function newGame(){return{version:1,day:1,cash:520,reputation:8,energy:100,capacity:80,stock:{tea:18,milk:16,boba:14,sugar:20,fruit:8,cream:8,coffee:8},prices:Object.fromEntries(Object.entries(recipes).map(([k,r])=>[k,r.basePrice])),unlocked:{classic:true,taro:true,fruit:true,cheese:false,coffee:false,seasonal:false},staff:{},upgrades:{},totalRevenue:0,totalCost:0,totalCustomers:0,totalLikes:0,log:['小店准备开张。'],customerLog:[],todayEvent:null,username:''}}
function setStatus(t,tone='info'){let e=$('status');e.textContent=t;e.className='notice '+tone;let live=$('liveRegion');if(live)live.textContent=(tone==='bad'?T.error:tone==='good'?T.success:T.tip)+t}function loginNotice(t,tone='info'){$('loginStatus').textContent=t;$('loginStatus').className='notice '+tone}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function sha256(t){let d=new TextEncoder().encode(t),h=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}async function api(path,opt={}){let headers=Object.assign({'X-Project-Key':PROJECT_KEY},opt.headers||{});if(opt.body&&!headers['Content-Type'])headers['Content-Type']='application/json';let res=await fetch(API_BASE+path,{...opt,headers});let data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'请求失败：'+res.status);return data}
async function ensureCollection(){try{await api('/collections/'+COLLECTION);return}catch(e){}await api('/collections',{method:'POST',body:JSON.stringify({name:COLLECTION,permissions:{publicRead:true,publicWrite:true},fields:[{name:'saveKey',type:'string',required:true,isList:false},{name:'username',type:'string',required:true,isList:false},{name:'stateJson',type:'text',required:true,isList:false},{name:'updatedAt',type:'string',required:true,isList:false}]})})}async function loginCloud(){let u=$('loginName').value.trim(),p=$('loginPass').value;if(!u||!p){loginNotice(T.needLogin,'bad');return}loginNotice(T.logining,'info');try{saveKey=await sha256('wangwang-milk-tea:'+u+':'+p);await ensureCollection();let list=await api('/collections/'+COLLECTION+'/records');let found=(list.items||[]).find(x=>x.data&&x.data.saveKey===saveKey);currentUser=u;if(found){recordId=found.id;state={...newGame(),...JSON.parse(found.data.stateJson)};state.username=u;cloud=true;enterGame(T.welcome,false)}else{recordId='';state=newGame();state.username=u;cloud=true;enterGame(T.newUser,true);await saveCloud(true)}}catch(e){loginNotice(T.loginFail+e.message,'bad')}}function enterGame(text,story){$('loginDialog').close();$('appRoot').removeAttribute('aria-hidden');$('cloudText').textContent=cloud?'☁️ '+T.cloud:'▶ '+T.local;$('userText').textContent=currentUser||T.local;setStatus(text,'good');render();if(story)showMessage(T.storyTitle,T.story)}async function saveCloud(silent=false){if(!cloud){if(!silent)setStatus('本机试玩无法云存档','bad');return}let payload={saveKey,username:currentUser,stateJson:JSON.stringify(state),updatedAt:new Date().toISOString()};try{if(recordId)await api('/collections/'+COLLECTION+'/records/'+recordId,{method:'PATCH',body:JSON.stringify({data:payload})});else{let r=await api('/collections/'+COLLECTION+'/records',{method:'POST',body:JSON.stringify({data:payload})});recordId=r.id}if(!silent)setStatus(T.saveOk,'good')}catch(e){if(!silent)setStatus(T.saveFail+e.message,'bad')}}function autoSave(){if(cloud){clearTimeout(autoSave.t);autoSave.t=setTimeout(()=>saveCloud(true),600)}}function showMessage(title,body){$('msgTitle').textContent=title;$('msgBody').innerHTML='<p>'+esc(body)+'</p>';$('msgDialog').showModal()}
function switchPage(page){document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('hidden',x.dataset.page!==page));document.querySelectorAll('[data-page-btn]').forEach(b=>b.setAttribute('aria-current',b.dataset.pageBtn===page?'page':'false'))}function recipeCost(k){return Object.entries(recipes[k].cost).reduce((s,[m,a])=>s+materials[m].unitCost*a,0)}function canMake(k){return Object.entries(recipes[k].cost).every(([m,a])=>(state.stock[m]||0)>=a)}function consume(k){for(let [m,a] of Object.entries(recipes[k].cost))state.stock[m]-=a}function chooseEvent(){let list=[{title:'学校社团下课',text:'学生组队来买奶茶，客流增加。',kind:'traffic',value:5},{title:'暴雨突袭',text:'雨太大，行人变少，但热饮更好卖。',kind:'rain',value:-2},{title:'美食博主路过',text:'一位博主正在观察小店。',kind:'blogger',value:0},{title:'原料小涨价',text:'今天进货价略有上涨。',kind:'cost',value:1.12},{title:'商场活动日',text:'附近商场办活动，顾客变多了。',kind:'traffic',value:3},{title:'平静的一天',text:'没有特别事件，稳稳经营吧。',kind:'normal',value:0}];return list[Math.floor(Math.random()*list.length)]}function dailyCustomerCount(){let n=8+Math.floor(state.reputation/10);if(state.staff.cashier)n+=2;if(state.staff.promoter)n+=4;if(state.upgrades.machine)n+=3;if(state.todayEvent&&state.todayEvent.kind==='traffic')n+=state.todayEvent.value;if(state.todayEvent&&state.todayEvent.kind==='rain')n-=2;return Math.max(3,n)}
function openDay(){state.todayEvent=chooseEvent();let customers=dailyCustomerCount(),rev=0,cost=0,likes=0,served=0;state.customerLog=[];let available=Object.keys(recipes).filter(k=>state.unlocked[k]);for(let i=0;i<customers;i++){let k=available[Math.floor(Math.random()*available.length)],r=recipes[k],price=state.prices[k],baseCost=recipeCost(k);if(!canMake(k)){state.customerLog.unshift('缺货：'+r.name+'的原料不够，顾客离开了。');continue}let buyChance=Math.min(.96,.52*r.charm*Math.max(.25,1-(price-r.basePrice)*.045)+state.reputation*.006);if(Math.random()>buyChance){state.customerLog.unshift('顾客嫌价格高，没有买'+r.name+'。');continue}consume(k);served++;rev+=price;cost+=baseCost;let good=Math.random()<(.55+state.reputation*.004+(state.staff.cashier?.08:0)+(state.upgrades.sofa?.08:0));if(good){likes++;state.customerLog.unshift('好评：'+r.name+'口感很棒，顾客说下次还来。')}else state.customerLog.unshift('普通评价：'+r.name+'还行，但没有惊喜。');if(Math.random()<.08){let bonus=8+Math.floor(Math.random()*18);rev+=bonus;state.customerLog.unshift('顾客加购小点心，额外收入 '+bonus+' 元')}if(Math.random()<.06){state.reputation=Math.max(0,state.reputation-1);state.customerLog.unshift('一位顾客等得太久，声望 -1。')}}let wages=Object.keys(state.staff).length*28,rent=35,profit=rev-cost-wages-rent;state.cash+=profit;state.reputation=Math.max(0,state.reputation+Math.floor(likes/3)-(served<customers/2?2:0));state.energy=Math.max(0,state.energy-28);state.totalRevenue+=rev;state.totalCost+=cost+wages+rent;state.totalCustomers+=served;state.totalLikes+=likes;state.log.unshift('第 '+state.day+' 天：接待 '+served+'/'+customers+' 人，收入 '+rev+'元，成本 '+(cost+wages+rent)+'元，净利润 '+profit+'元');showMessage('今日事件：'+state.todayEvent.title,state.todayEvent.text+'\n\n今日净利润：'+profit+' 元');state.day++;setStatus('营业结束，净利润 '+profit+' 元','good');render();autoSave()}function restHalf(){state.energy=Math.min(100,state.energy+25);state.cash-=12;state.log.unshift('整理半天，花费 12 元，体力恢复。');setStatus('已整理店铺，体力恢复。','good');render();autoSave()}function buyMaterial(k,qty){let factor=state.todayEvent&&state.todayEvent.kind==='cost'?state.todayEvent.value:1,price=Math.ceil(materials[k].unitCost*qty*factor),used=Object.values(state.stock).reduce((a,b)=>a+b,0);if(used+qty>state.capacity){setStatus('现金不足或条件不满足。','bad');return}if(state.cash<price){setStatus('现金不足或条件不满足。','bad');return}state.cash-=price;state.stock[k]=(state.stock[k]||0)+qty;state.totalCost+=price;state.log.unshift('采购 '+materials[k].name+' x'+qty+'，花费 '+price+' 元');setStatus('操作成功。','good');render();autoSave()}function setPrice(k,v){v=Number(v);let min=recipeCost(k)+2;if(v<min){setStatus(recipes[k].name+' 售价不能低于 '+min+' 元','bad');render();return}state.prices[k]=Math.min(60,v);setStatus('已调整 '+recipes[k].name+' 价格。','good');render();autoSave()}function unlockRecipe(k){let price={cheese:220,coffee:260,seasonal:360}[k]||200;if(state.cash<price){setStatus('现金不足或条件不满足。','bad');return}state.cash-=price;state.unlocked[k]=true;state.log.unshift('研发解锁：'+recipes[k].name+'。');setStatus('研发成功。','good');render();autoSave()}function hire(k){let d=staffDefs[k];if(state.staff[k])return;if(state.cash<d.cost){setStatus('现金不足或条件不满足。','bad');return}state.cash-=d.cost;state.staff[k]=true;state.log.unshift('雇佣了 '+d.name+'。');setStatus('操作成功。','good');render();autoSave()}function upgrade(k){let d=upgradeDefs[k];if(state.upgrades[k])return;if(state.cash<d.cost){setStatus('现金不足或条件不满足。','bad');return}state.cash-=d.cost;state.upgrades[k]=true;if(k==='fridge')state.capacity+=50;state.log.unshift('店铺升级：'+d.name+'。');setStatus('操作成功。','good');render();autoSave()}
function render(){renderStats();renderMenu();renderBuy();renderStaff();renderBook();$('dayInfo').textContent='第 '+state.day+' 天';$('todayEvent').textContent=state.todayEvent?'今日事件：'+state.todayEvent.title+'：'+state.todayEvent.text:T.notOpen}function renderStats(){$('stats').innerHTML=[[T.cash,state.cash],[T.rep,state.reputation],[T.energy,state.energy],[T.store,Object.values(state.stock).reduce((a,b)=>a+b,0)+'/'+state.capacity],['总顾客',state.totalCustomers],['总好评',state.totalLikes],['总收入',state.totalRevenue],['总成本',state.totalCost]].map(([k,v])=>'<div class="stat"><span class="small">'+k+'</span><strong>'+v+'</strong></div>').join('')}function renderMenu(){$('menuList').innerHTML=Object.entries(recipes).map(([k,r])=>{let unlocked=state.unlocked[k],cost=recipeCost(k),dev={cheese:220,coffee:260,seasonal:360}[k];return '<div class="item"><div class="between"><strong>'+r.emoji+' '+r.name+'</strong><span>成本 '+cost+' 元</span></div>'+(unlocked?'<label>售价<input type="number" min="'+(cost+2)+'" max="60" value="'+state.prices[k]+'" data-price="'+k+'"></label><p class="small">建议售价 '+r.basePrice+' 元，当前毛利 '+(state.prices[k]-cost)+' 元</p>':'<p class="small">研发费用 '+dev+' 元</p><button class="btn" data-unlock="'+k+'">研发</button>')+'</div>'}).join('');document.querySelectorAll('[data-price]').forEach(i=>i.onchange=()=>setPrice(i.dataset.price,i.value));document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>unlockRecipe(b.dataset.unlock))}function renderBuy(){$('stockList').innerHTML=Object.entries(materials).map(([k,m])=>'<div class="item"><div class="between"><strong>'+m.name+'</strong><span>库存 '+(state.stock[k]||0)+'</span></div><p class="small">进货单价 '+m.unitCost+' 元/份</p><div class="row"><button class="btn secondary" data-buy="'+k+'" data-qty="5">买 5</button><button class="btn" data-buy="'+k+'" data-qty="15">买 15</button></div></div>').join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyMaterial(b.dataset.buy,Number(b.dataset.qty)))}function renderStaff(){$('staffList').innerHTML=Object.entries(staffDefs).map(([k,d])=>'<div class="item"><div class="between"><strong>'+d.name+'</strong><button class="btn" data-hire="'+k+'" '+(state.staff[k]?'disabled':'')+'>'+(state.staff[k]?'已雇佣':'雇佣 '+d.cost)+'</button></div><p class="small">'+d.desc+'</p></div>').join('');$('upgradeList').innerHTML=Object.entries(upgradeDefs).map(([k,d])=>'<div class="item"><div class="between"><strong>'+d.name+'</strong><button class="btn secondary" data-upgrade="'+k+'" '+(state.upgrades[k]?'disabled':'')+'>'+(state.upgrades[k]?'已升级':'升级 '+d.cost)+'</button></div><p class="small">'+d.desc+'</p></div>').join('');document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>hire(b.dataset.hire));document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>upgrade(b.dataset.upgrade))}function renderBook(){$('bookStats').innerHTML=[['累计收入',state.totalRevenue],['累计成本',state.totalCost],['累计净利',state.totalRevenue-state.totalCost],[T.cash,state.cash]].map(([k,v])=>'<div class="stat"><span class="small">'+k+'</span><strong>'+v+'</strong></div>').join('');$('gameLog').innerHTML=state.log.slice(0,80).map(x=>'<div>'+esc(x)+'</div>').join('');$('customerLog').innerHTML=state.customerLog.slice(0,80).map(x=>'<div>'+esc(x)+'</div>').join('')}function bind(){document.querySelectorAll('[data-page-btn]').forEach(b=>b.onclick=()=>switchPage(b.dataset.pageBtn));$('openBtn').onclick=openDay;$('restBtn').onclick=restHalf;$('manualSaveBtn').onclick=()=>saveCloud(false);$('msgOk').onclick=()=>$('msgDialog').close();$('newGameBtn').onclick=()=>{if(confirm('确定要重开当前存档吗？云存档会被覆盖。')){state=newGame();state.username=currentUser;render();setStatus('操作成功。','good');autoSave()}};$('loginForm').addEventListener('submit',e=>{e.preventDefault();loginCloud()});$('loginLocal').onclick=e=>{e.preventDefault();currentUser=T.local;cloud=false;enterGame('已进入本机试玩。',true)}}bind();render();$('loginDialog').showModal();
