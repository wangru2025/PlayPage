name: PlayPage Client Build

on:
  push:
    paths:
      - 'PlayPageClient/**'
      - '.github/workflows/playpage-client.yml'
  pull_request:
    paths:
      - 'PlayPageClient/**'
      - '.github/workflows/playpage-client.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows WinForms
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PlayPageClient
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/PlayPage.Windows/PlayPage.Windows.csproj

      - name: Build
        run: dotnet build src/PlayPage.Windows/PlayPage.Windows.csproj -c Release --no-restore

      - name: Publish portable folder
        run: dotnet publish src/PlayPage.Windows/PlayPage.Windows.csproj -c Release -o artifacts/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayPage-Windows
          path: PlayPageClient/artifacts/windows

  android:
    name: Android traditional Views
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlayPageClient
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore src/PlayPage.Android/PlayPage.Android.csproj

      - name: Generate Android signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore playpage-ci.keystore \
            -alias playpage \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass playpage-ci-pass \
            -keypass playpage-ci-pass \
            -dname "CN=PlayPage CI,O=PlayPage,L=Internet,S=Internet,C=CN"

      - name: Build signed APK
        run: >-
          dotnet build src/PlayPage.Android/PlayPage.Android.csproj -c Release --no-restore
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ github.workspace }}/PlayPageClient/playpage-ci.keystore
          -p:AndroidSigningStorePass=playpage-ci-pass
          -p:AndroidSigningKeyAlias=playpage
          -p:AndroidSigningKeyPass=playpage-ci-pass

      - name: Collect and verify APK
        shell: bash
        run: |
          mkdir -p artifacts/android
          find src/PlayPage.Android/bin/Release -name '*Signed.apk' -print -exec cp {} artifacts/android/PlayPage-Android.apk \;
          if [ ! -f artifacts/android/PlayPage-Android.apk ]; then
            find src/PlayPage.Android/bin/Release -name '*.apk' -print -exec cp {} artifacts/android/PlayPage-Android.apk \; -quit
          fi
          if [ ! -f artifacts/android/PlayPage-Android.apk ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner verify --verbose artifacts/android/PlayPage-Android.apk
          ls -la artifacts/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayPage-Android
          path: PlayPageClient/artifacts/android
